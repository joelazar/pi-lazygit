id = "pi-lazygit"
name = "pi-lazygit"
version = "1.1.0"
min_herdr_version = "0.9.0"
description = "lazygit pane opened by the pi-lazygit extension"
platforms = ["linux", "macos"]

[[panes]]
id = "lazygit"
title = "lazygit"
# overlay = temporary zoomed pane; unlike a popup it keeps Herdr's prefix keys working
placement = "overlay"
command = ["sh", "-c", "exec lazygit"]
